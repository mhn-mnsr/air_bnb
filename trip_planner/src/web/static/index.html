<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Planner (CrewAI)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 0; background: #0b1020; color: #eef; }
    header { padding: 16px; background: #12183a; border-bottom: 1px solid #1f2756; }
    main { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px; }
    .card { background: #12183a; border: 1px solid #1f2756; border-radius: 12px; padding: 16px; }
    label { display: block; margin: 10px 0 6px; font-size: 14px; color: #aecdff; }
    input, select, textarea { width: 100%; padding: 10px 12px; background: #0b1020; border: 1px solid #1f2756; border-radius: 8px; color: #eef; }
    button { margin-top: 12px; background: #2f80ed; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    footer { padding: 12px 16px; color: #9db7ff; }
  </style>
  <script>
    async function submitForm(ev) {
      ev.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Planning…';
      const origin_city = document.getElementById('origin').value.trim();
      const month = document.getElementById('month').value.trim();
      const duration_days = Number(document.getElementById('days').value);
      const interests = document.getElementById('interests').value.split(',').map(s => s.trim()).filter(Boolean);
      const budget = document.getElementById('budget').value.trim();
      const model = document.getElementById('model').value.trim();
      const payload = { origin_city, month, duration_days, interests, model };
      if (budget) payload.budget_usd = Number(budget);
      try {
        const res = await fetch('/api/plan', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Request failed');
        document.getElementById('output').textContent = data.output;
      } catch (e) {
        document.getElementById('output').textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false; btn.textContent = 'Plan Trip';
      }
    }
  </script>
  </head>
  <body>
    <header>
      <h2>Trip Planner (CrewAI)</h2>
    </header>
    <main>
      <section class="card">
        <form onsubmit="submitForm(event)">
          <label for="origin">Origin city</label>
          <input id="origin" placeholder="San Francisco" value="San Francisco" />

          <div class="row">
            <div>
              <label for="month">Month</label>
              <input id="month" placeholder="June" value="June" />
            </div>
            <div>
              <label for="days">Duration (days)</label>
              <input id="days" type="number" min="1" max="30" value="7" />
            </div>
          </div>

          <label for="interests">Interests (comma separated)</label>
          <input id="interests" placeholder="food, museums, nature" value="food, museums, nature" />

          <label for="budget">Budget USD (optional)</label>
          <input id="budget" type="number" min="0" placeholder="e.g. 2500" />

          <label for="model">Model (optional)</label>
          <input id="model" placeholder="openai/gpt-4o-mini or groq/llama-3.3-70b-versatile" />

          <button id="submitBtn" type="submit">Plan Trip</button>
        </form>
      </section>
      <section class="card">
        <h3>Output</h3>
        <pre id="output">Fill the form and click Plan Trip.</pre>
      </section>
    </main>
    <footer>
      Uses your configured provider via environment (e.g., OPENAI_API_KEY or GROQ_API_KEY).
    </footer>
  </body>
  </html>
